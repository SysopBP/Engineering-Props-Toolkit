# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Build Engineering Props APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify command timeout and output bounds
        run: |
          mkdir -p /tmp/engineering-check
          javac -d /tmp/engineering-check app/src/main/java/com/sysopbp/engineeringprops/CommandRunner.java app/src/main/java/com/sysopbp/engineeringprops/ToolkitConfig.java ci/CommandRunnerCheck.java ci/ToolkitConfigCheck.java
          java -cp /tmp/engineering-check CommandRunnerCheck
          java -cp /tmp/engineering-check ToolkitConfigCheck
      - name: Build debug APK
        run: gradle :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: EngineeringProps-Companion-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
